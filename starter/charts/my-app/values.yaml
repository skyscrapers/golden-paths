replicaCount: 1

image:
  repository: ""  # Set per environment, e.g. 123456789.dkr.ecr.eu-west-1.amazonaws.com/my-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    # No CPU limit — Skyscrapers best practice

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

# startupProbe: {}
# Uncomment for slow-starting apps. Liveness/readiness probes are
# held until startup succeeds. Example:
#   httpGet:
#     path: /health
#     port: 8080
#   failureThreshold: 30
#   periodSeconds: 2

terminationGracePeriodSeconds: 30

preStopSleep: 5
# Seconds to sleep before SIGTERM, allowing endpoints to depropagete

securityContext: {}
# Pod-level security context. Example:
#   fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

env: {}
  # Example:
  # MY_VAR: my-value

secretRef: ""
# Name of a Kubernetes Secret to load as environment variables
# Set per environment, e.g. my-app-secrets
# See: golden-paths/manage-your-secrets

metrics:
  enabled: false
  port: 9090
  path: /metrics
  interval: 30s

alerts:
  enabled: false
  rules: []
  # Example:
  # rules:
  #   - alert: MyAppDown
  #     expr: up{job="my-app"} == 0
  #     for: 5m
  #     labels:
  #       severity: critical
  #       namespace: flux-apps
  #     annotations:
  #       summary: "my-app is down"
  #       runbook_url: "https://github.com/my-org/my-app/blob/main/runbook.md"

networkPolicy:
  enabled: false

pdb:
  enabled: false
  minAvailable: 1

podAntiAffinity:
  enabled: false

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  # Example:
  # hosts:
  #   - host: my-app.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
