image: alpine:latest

stages:
  - build-image
  - package-chart

variables:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
  IMAGE_NAME: my-app
  CHART_NAME: my-app

build-image:
  stage: build-image
  image:
    name: docker:27
    entrypoint: [""]
  tags:
    - sks
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - app/**
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG ./app/
    - docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

package-chart:
  stage: package-chart
  image:
    name: alpine/helm:3.17
    entrypoint: [""]
  tags:
    - sks
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - charts/my-app/Chart.yaml
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | helm registry login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - helm package ./charts/$CHART_NAME/
    - CHART_VERSION=$(helm show chart ./charts/$CHART_NAME/ | grep '^version:' | awk '{print $2}')
    - helm push "./$CHART_NAME-${CHART_VERSION}.tgz" oci://$ECR_REGISTRY
