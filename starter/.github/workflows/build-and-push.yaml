name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "charts/**"

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
  IMAGE_NAME: my-app
  CHART_NAME: my-app

jobs:
  build-image:
    runs-on: [self-hosted]
    if: contains(github.event.commits.*.modified, 'app/') || contains(github.event.commits.*.added, 'app/')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: app
        run: |
          IMAGE_TAG="${{ github.sha }}"
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

  package-chart:
    runs-on: [self-hosted]
    if: contains(github.event.commits.*.modified, 'charts/') || contains(github.event.commits.*.added, 'charts/')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR for Helm
        run: |
          aws ecr get-login-password --region $AWS_REGION | helm registry login --username AWS --password-stdin $ECR_REGISTRY

      - name: Package and push chart
        run: |
          helm package charts/$CHART_NAME
          CHART_VERSION=$(grep '^version:' charts/$CHART_NAME/Chart.yaml | awk '{print $2}')
          helm push $CHART_NAME-$CHART_VERSION.tgz oci://$ECR_REGISTRY
