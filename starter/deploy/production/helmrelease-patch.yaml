apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: my-app
  namespace: flux-apps
spec:
  values:
    replicaCount: 2

    image:
      repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/my-app
      tag: "1.0.0"

    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "256Mi"

    env:
      APP_ENV: production
